services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchen-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kitchen-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kitchen-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR}
    command: ["/app/migrate"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ${HTTP_ADDR}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      OPENAPI_PATH: ${OPENAPI_PATH}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OPENAPI_VALIDATE: ${OPENAPI_VALIDATE}
    ports:
      - "${API_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

  restaurant-sample:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen-restaurant-sample
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["/app/restaurant-sample"]
    environment:
      API_BASE_URL: ${API_BASE_URL}
      RESTAURANT_KEY: ${RESTAURANT_KEY}
      RESTAURANT_ID: ${RESTAURANT_ID}
      RABBITMQ_URL: ${RABBITMQ_URL}
      POLL_INTERVAL: ${POLL_INTERVAL}
      COOK_DELAY_MS: ${COOK_DELAY_MS}

volumes:
  pgdata:
